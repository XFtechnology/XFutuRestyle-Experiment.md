name: Build Static VR Player APK
on:
  push:
    branches:
      - build/staticvr-apk-20261110
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack Android project
        run: mkdir -p vr-build && unzip -q -o vr-android/project.zip -d vr-build
      - name: Assemble installable debug APK
        working-directory: vr-build
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: StaticVRPlayer-APK
          path: vr-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
